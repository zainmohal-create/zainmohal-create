name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Orange Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: zainmohal-create
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=orange
            dist/github-snake-dark.svg?palette=github-dark&color_snake=orange

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
